name: Release

# Runs the full check suite on a version tag and attaches the packed npm
# tarballs to the GitHub release. Publishing to npm is a manual step until an
# NPM_TOKEN secret is configured; see the "Publish" step below.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Pack
        run: |
          mkdir -p artifacts
          for pkg in cli gateway shield; do
            (cd packages/$pkg && pnpm pack --pack-destination ../../artifacts)
          done
          ls -la artifacts

      - name: Attach tarballs to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true

      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r --filter './packages/*' --filter '!@evidentai/detectors' publish --access public --no-git-checks
